<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Production RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1>Advanced RAG Pipeline</h1>
            <p>100% Local. Zero API Keys. Maximum Privacy.</p>
        </header>

        <main class="grid-layout">
            <!-- Ingestion Panel -->
            <section class="panel glass-panel">
                <div class="panel-header">
                    <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Document Ingestion</h2>
                </div>
                <div class="panel-content">
                    <p class="panel-subtitle">Upload text to train the local system.</p>
                    <form id="ingest-form">
                        <div class="input-group">
                            <label for="doc-source">Source Name</label>
                            <input type="text" id="doc-source" placeholder="e.g. quantum_physics.txt" value="custom_document.txt">
                        </div>
                        <div class="input-group">
                            <label for="doc-text">Document Content</label>
                            <textarea id="doc-text" rows="8" placeholder="Paste your text here..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" id="ingest-btn">
                            <span class="btn-text">Ingest Document</span>
                            <div class="spinner hidden"></div>
                        </button>
                    </form>
                    <div id="ingest-status" class="status-msg hidden"></div>
                </div>
            </section>

            <!-- Query Panel -->
            <section class="panel glass-panel">
                <div class="panel-header">
                    <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> Ask the AI</h2>
                </div>
                <div class="panel-content">
                    <p class="panel-subtitle">Query your ingested documents.</p>
                    <form id="query-form">
                        <div class="input-group">
                            <label for="user-query">Your Question</label>
                            <div class="query-input-wrapper">
                                <input type="text" id="user-query" placeholder="Ask something...">
                                <button type="submit" class="btn btn-icon" id="query-btn">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                    <div class="spinner hidden spinner-small"></div>
                                </button>
                            </div>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="use-hyde" checked>
                            <label for="use-hyde">Use HyDE (Hypothetical Document Embeddings)</label>
                        </div>
                    </form>

                    <div id="results-container" class="results-container hidden">
                        <div class="ai-answer">
                            <h3>Generated Answer</h3>
                            <div id="answer-content" class="answer-text"></div>
                        </div>
                        <div class="retrieved-context">
                            <h3>Retrieved Sources</h3>
                            <div id="sources-content" class="sources-list"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
